# OpenBao KBM Plugin Configuration (plugins/tas_kbm_openbao.py)
# Precedence: config file > environment variables > built-in defaults

# OpenBao / HashiCorp Vault server endpoint.
# Fallback env vars: BAO_ADDR, then VAULT_ADDR. (Dev example: "http://127.0.0.1:8200")
url: "https://127.0.0.1:8200"

# Authentication Method: "token" (default) or "approle"
# Fallback env var: BAO_AUTH_METHOD
auth_method: "approle"

# --- 1. Token Authentication (when auth_method: token) ---
# Precedence: token -> BAO_TOKEN -> VAULT_TOKEN -> token_file.
# Pass via env var substitution (default) or hardcode for testing:
# token: "${BAO_TOKEN}"
# Alternatively, read token from a secure mounted file (e.g., Kubernetes Secret or ramfs):
# token_file: "/run/secrets/bao_token"

# --- 2. AppRole Authentication (when auth_method: approle) ---
# role_id: AppRole Role ID (required). Fallback env var: BAO_ROLE_ID
# secret_id: AppRole Secret ID (optional if secret_id_file is given). Fallback env var: BAO_SECRET_ID
# secret_id_file: Path to injected Secret ID file (precedence over secret_id). Fallback env var: BAO_SECRET_ID_FILE
# approle_mount: Auth mount endpoint prefix (default: "approle"). Fallback env var: BAO_APPROLE_MOUNT
# token_renew_on_401: Automatically reauthenticate on HTTP 401 (default: true). Fallback env var: BAO_TOKEN_RENEW_ON_401
# Example AppRole configuration:
# role_id: "${BAO_ROLE_ID}"
# secret_id: "${BAO_SECRET_ID}"
# secret_id_file: "/run/secrets/openbao-secret-id"
# approle_mount: "approle"
# token_renew_on_401: true
role_id: "${BAO_ROLE_ID}"
secret_id_file: "/home/stansfie/openbao/approle/secret_id"
approle_mount: "approle"
token_renew_on_401: true

# KV Secrets Engine
# mount_point: path where the KV engine is mounted (e.g., "secret", "kv")
# kv_version: KV engine version: 1 (legacy /v1/secret/key) or 2 (default /v1/secret/data/key)
# Fallback env var: BAO_KV_VERSION
mount_point: "secret"
kv_version: 2

# Name of the JSON key containing the secret payload.
# If omitted or not found in the secret map, single-value maps or the full payload are returned.
secret_field: "secret"

# TLS / SSL Verification
# Set verify_ssl to false ONLY in local development/debug environments.
# ca_bundle: optional custom CA certificate bundle for self-signed or internal CAs.
verify_ssl: true
ca_bundle: "/home/stansfie/openbao/certs/ca.crt"

# HTTP request timeout in seconds.
# Fallback env var: BAO_REQUESTS_TIMEOUT
requests_timeout: 30

# HTTP Retry Strategy for transient network errors and status codes (429, 500, 502, 503, 504).
# retry_backoff_factor: exponential backoff multiplier (e.g. 0.05 -> 0.1s, 0.2s, etc.)
# Fallback env vars: BAO_RETRY_TOTAL, BAO_RETRY_BACKOFF_FACTOR
retry_total: 3
retry_backoff_factor: 0.05

# Connection Pool Settings
# pool_connections: Number of distinct host connection pools cached by urllib3 (per worker process).
# pool_maxsize: Maximum concurrent connections per pool. With pool_block=True, this is a hard
# upper bound; connection acquisition blocks when all connections in the pool are checked out.
# Note: Connection limits apply per TAS worker process. Total concurrent connections to OpenBao
# across a deployment will be (worker_processes * pool_maxsize).
# Fallback env vars: BAO_POOL_CONNECTIONS, BAO_POOL_MAXSIZE
pool_connections: 10
pool_maxsize: 20