# OpenBao KBM plugin configuration (plugins/tas_kbm_openbao.py)
# OpenBao server URL (e.g. http://127.0.0.1:8200 (local))
url: "https://127.0.0.1:8200"
mount_point: "secret"
kv_version: 2
secret_field: "secret"

verify_ssl: true

ca_bundle: "/opt/openbao/certs/ca.crt"
requests_timeout: 30

auth_method: "approle"
role_id: "${BAO_ROLE_ID}"
secret_id: "${BAO_SECRET_ID}"
# secret_id_file: "/var/run/secrets/openbao/secret-id" # Alternative to secret_id
approle_mount: "approle"

# Auto-create key options
create_key_if_absent: false
generated_secret_bytes: 32

retry_total: 3
retry_backoff_factor: 0.05
pool_connections: 10
pool_maxsize: 20